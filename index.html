  :root {
    --bg: #fff6e9; --card: #fff; --ink: #2a2250; --muted: #7a7396; --line: #ece2d2;
    --primary: #6c5ce7; --primary-d: #4b3cc4;
    --green: #2ecc71; --green-d: #1f9d55;
    --red: #ff5a5f; --red-d: #d63c41;
    --yellow: #ffc83d; --yellow-d: #e0a400;
    --blue: #3fa7ff; --blue-d: #1f7fd1;
    --orange: #ff9f43; --orange-d: #de7a12;
    --pink: #ff6fae; --pink-d: #d94b8a;
    --teal: #1dd1a1; --teal-d: #0f9f7a;
    --mc: var(--primary); --mcd: var(--primary-d);
    --r: 22px;
    --font: 'RubikLocal', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); color: var(--ink); min-height: 100vh; min-height: 100dvh;
    background: var(--bg);
    background-image: radial-gradient(circle at 0% 0%, #ffe0bd 0, transparent 38%),
                      radial-gradient(circle at 100% 35%, #e6dfff 0, transparent 34%),
                      radial-gradient(circle at 10% 100%, #d9f7ec 0, transparent 30%);
    background-attachment: fixed;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  .app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

  /* floating math symbols in the background */
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bgfx span { position: absolute; font-weight: 900; opacity: .09; animation: drift linear infinite; }
  @keyframes drift { 0% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-26px) rotate(14deg); } 100% { transform: translateY(0) rotate(0); } }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 12px; }
  .icon-btn { width: 46px; height: 46px; border-radius: 15px; border: none; background: #fff; box-shadow: 0 4px 0 var(--line);
    font-size: 21px; display: grid; place-items: center; flex: none; }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { background: #fff; border-radius: 999px; padding: 9px 13px; font-weight: 800; box-shadow: 0 4px 0 var(--line);
    white-space: nowrap; font-size: 16px; display: flex; gap: 5px; align-items: center; }
  .chip.bump { animation: pop .5s; }
  .chip.combo { background: var(--orange); color: #fff; box-shadow: 0 4px 0 var(--orange-d); }
  .screen:not([hidden]) { animation: in .28s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 50% { transform: scale(1.12); } }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* ---------- home ---------- */
  .hello { display: flex; align-items: center; gap: 14px; margin: 2px 0 14px; }
  .hello h1 { margin: 0; font-size: clamp(27px, 6.5vw, 36px); font-weight: 800; line-height: 1.15; }
  .hello p { margin: 3px 0 0; color: var(--muted); font-size: 17px; }
  .buddy svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .hello-buddy { width: 84px; height: 84px; flex: none; animation: bounce 2.2s ease-in-out infinite; }
  .level-card { background: #fff; border-radius: 20px; padding: 13px 16px; box-shadow: 0 4px 0 var(--line); margin-bottom: 18px; }
  .level-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 16px; }
  .level-head b { font-size: 18px; }
  .level-head span { color: var(--muted); font-size: 14px; font-weight: 700; text-align: left; }
  .meter { height: 16px; background: #f4eee4; border-radius: 999px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 999px; transition: width .6s; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  .tile { --c: var(--primary); --cd: var(--primary-d);
    border: none; border-radius: var(--r); background: var(--c); color: #fff; padding: 16px 14px 15px; text-align: right;
    display: flex; flex-direction: column; gap: 3px; box-shadow: 0 6px 0 var(--cd); min-height: 128px;
    transition: transform .08s, box-shadow .08s; position: relative; overflow: hidden; }
  .tile::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.14); left: -34px; bottom: -48px; }
  .tile::before { content: attr(data-sym); position: absolute; left: 12px; top: 6px; font-size: 44px; font-weight: 900; opacity: .18; direction: ltr; }
  .tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cd); }
  .tile .ti { font-size: 36px; line-height: 1; margin-bottom: 8px; }
  .tile b { font-size: 20px; font-weight: 800; }
  .tile small { font-size: 14px; opacity: .95; }
  .tile.dark { color: var(--ink); }
  .tile.wide { width: 100%; margin-top: 14px; min-height: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
  .tile.wide .ti { grid-row: span 2; margin: 0; font-size: 38px; }
  .tile.white { --c: #fff; --cd: var(--line); color: var(--ink); }
  .tile.white small { color: var(--muted); }
  .tile .hero-mini { grid-row: span 2; width: 62px; height: 62px; }
  .t-blue { --c: var(--blue); --cd: var(--blue-d); }
  .t-purple { --c: var(--primary); --cd: var(--primary-d); }
  .t-pink { --c: var(--pink); --cd: var(--pink-d); }
  .t-orange { --c: var(--orange); --cd: var(--orange-d); }
  .t-teal { --c: var(--teal); --cd: var(--teal-d); }
  .t-yellow { --c: var(--yellow); --cd: var(--yellow-d); }
  .t-red { --c: var(--red); --cd: var(--red-d); }
  .badge { display: inline-block; background: rgba(255,255,255,.28); border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 800; margin-top: 2px; }
  .tile.white .badge { background: #fff1de; color: #8a6300; }

  /* ---------- game ---------- */
  .progress { height: 14px; background: #fff; border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 0 var(--line); }
  .bar { height: 100%; width: 0; background: var(--mc); border-radius: 999px; transition: width .45s ease; }
  .q-meta { text-align: center; color: var(--muted); font-weight: 700; margin: 12px 0; font-size: 16px; }
  .timer-num { text-align: center; font-size: 24px; font-weight: 800; color: var(--mcd); margin: 10px 0 0; }
  .timer-num.hurry { color: var(--red-d); animation: pop .5s infinite; }
  .prompt-card { position: relative; background: #fff; border-radius: 28px; padding: 62px 16px 24px; text-align: center; box-shadow: 0 6px 0 var(--line); margin-bottom: 18px; }
  .prompt-card.pop { animation: pop .35s; }
  .prompt-card.shake { animation: shake .4s; }
  .say { position: absolute; top: 12px; left: 12px; border: none; background: #ece8ff; width: 50px; height: 50px; border-radius: 50%; font-size: 22px; box-shadow: 0 4px 0 #d3cbff; }
  .say:active { transform: translateY(3px); box-shadow: 0 1px 0 #d3cbff; }
  .card-buddy { position: absolute; top: -18px; right: -6px; width: 70px; height: 70px; }
  .card-buddy.yay { animation: cheer .8s ease-in-out; }
  .card-buddy.sad { animation: sad .7s ease-in-out; }
  @keyframes cheer { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(-18px) rotate(8deg); } }
  @keyframes sad { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-12deg) translateY(4px); } 60% { transform: rotate(10deg) translateY(4px); } }
  .expr { font-size: clamp(40px, 11.5vw, 66px); font-weight: 800; color: var(--ink); direction: ltr; display: flex; align-items: center; justify-content: center; gap: .22em; flex-wrap: wrap; line-height: 1.2; margin-top: 0; }
  .expr .op { color: var(--mc); }
  .slot { min-width: 1.7em; padding: 0 .2em; height: 1.3em; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
    background: #f6f2ff; border: 4px dashed var(--mc); color: var(--mc); }
  .slot.typed { border-style: solid; background: #fff; color: var(--ink); }
  .slot.ok { background: var(--green); border: 4px solid var(--green-d); color: #fff; animation: pop .35s; }
  .slot.bad { background: var(--red); border: 4px solid var(--red-d); color: #fff; animation: shake .4s; }
  .story { font-size: clamp(20px, 5.2vw, 26px); font-weight: 700; line-height: 1.65; text-align: right; padding: 0 4px; }
  .story-ans { margin-top: 16px; font-size: 22px; font-weight: 800; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 12px; }
  .story-ans .slot { font-size: 40px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { border: none; border-radius: 20px; padding: 14px 8px; min-height: 84px; font-size: clamp(30px, 8.5vw, 40px); font-weight: 800;
    color: #fff; direction: ltr; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .opt.o0 { background: var(--blue); box-shadow: 0 6px 0 var(--blue-d); }
  .opt.o1 { background: var(--pink); box-shadow: 0 6px 0 var(--pink-d); }
  .opt.o2 { background: var(--orange); box-shadow: 0 6px 0 var(--orange-d); }
  .opt.o3 { background: var(--teal); box-shadow: 0 6px 0 var(--teal-d); }
  .opt:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--green); box-shadow: 0 6px 0 var(--green-d); animation: pop .35s; opacity: 1; }
  .opt.wrong { background: var(--red); box-shadow: 0 6px 0 var(--red-d); animation: shake .4s; opacity: 1; }
  .opt.dim { opacity: .35; }
  .tf .opt { direction: rtl; font-size: 28px; min-height: 96px; }
  .tf .yes { background: var(--green); box-shadow: 0 6px 0 var(--green-d); }
  .tf .no { background: var(--red); box-shadow: 0 6px 0 var(--red-d); }

  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; max-width: 360px; margin: 0 auto; direction: ltr; }
  .key { height: 66px; border: none; border-radius: 18px; background: #fff; font-size: 32px; font-weight: 800; color: var(--ink); box-shadow: 0 5px 0 var(--line); transition: transform .06s, box-shadow .06s; }
  .key:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }

<script>
'use strict';
/* ==================================================
   Storage
   ================================================== */
const KEY = 'tair-math-v2';
const DEF = () => ({
  name: '', gender: '', stars: 0, xp: 0, freeBoxes: 0,
  heroes: { owned: {}, skin: {}, buddy: '' },
  streak: { last: '', count: 0 }, stats: {}, days: {}, best: {},
  settings: { add: true, sub: true, mul: true, div: true, range: 100, perRound: 10, voice: true, sound: true }
});
let P = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw), def = DEF();
      const out = Object.assign(def, d, {
        settings: Object.assign(def.settings, d.settings || {}),
        streak: Object.assign(def.streak, d.streak || {}),
        heroes: Object.assign(def.heroes, d.heroes || {})
      });
      if (d.xp === undefined) out.xp = d.stars || 0;     // older version: stars were also the level counter
      return out;
    }
  } catch (e) {}
  return DEF();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

/* ==================================================
   Utils
   ================================================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const dstr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => dstr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dstr(d); };
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function wpick(items, weights) {
  const tot = weights.reduce((a, b) => a + b, 0); let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
// gender: g('feminine', 'masculine')
const g = (f, m) => P.gender === 'm' ? m : f;
const N = () => esc(P.name || g('אלופה', 'אלוף'));

/* ==================================================
   Sound (generated, no files) + Hebrew-only voice
   ================================================== */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, start, dur, type = 'sine', vol = 0.16) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), gn = c.createGain(), t = c.currentTime + start;
  o.type = type; o.frequency.value = freq;
  gn.gain.setValueAtTime(0.0001, t);

/* ==================================================
   Smart practice: skill selection + problem generation
   ================================================== */
const OPS = { add: '+', sub: '−', mul: '×', div: '÷' };
const WORD = { '+': 'ועוד', '−': 'פחות', '×': 'כפול', '÷': 'חלקי' };
const opOf = k => k.replace(/\d+/, '');
const skillsOf = op => (op === 'add' || op === 'sub') ? [op] : range(2, 10).map(t => op + t);
function errRate(k) { const st = P.stats[k]; if (!st || !st.r.length) return null; return st.r.filter(x => !x).length / st.r.length; }
function skillWeight(k) { const st = P.stats[k]; if (!st || st.n < 2) return 2.2; return 1 + 6 * errRate(k); }
function pickSkill() {
  const s = P.settings;
  let ops = ['add', 'sub', 'mul', 'div'].filter(o => s[o]); if (!ops.length) ops = ['add'];
  const opW = ops.map(o => { const ks = skillsOf(o); return ks.reduce((m, k) => m + skillWeight(k), 0) / ks.length; });
  const op = wpick(ops, opW), ks = skillsOf(op);
  return ks.length === 1 ? ks[0] : wpick(ks, ks.map(skillWeight));
}
function makeProblem(skill) {
  const Rg = P.settings.range, op = opOf(skill);
  let a, b, ans;
  if (op === 'add') {
    if (Rg <= 20) { a = rnd(2, Rg - 2); b = rnd(2, Rg - a); }
    else { a = rnd(Math.round(Rg * .1), Math.round(Rg * .6)); b = rnd(Math.round(Rg * .05), Rg - a); }
    ans = a + b;
  } else if (op === 'sub') {
    a = rnd(Rg <= 20 ? 6 : Math.round(Rg * .3), Rg); b = rnd(Math.max(2, Math.round(a * .1)), a - 2); ans = a - b;
  } else if (op === 'mul') {
    const t = +skill.slice(3); let o = rnd(1, 10); if (o === 1 && Math.random() < .7) o = rnd(2, 10);
    [a, b] = Math.random() < .5 ? [t, o] : [o, t]; ans = a * b;
  } else {
    const t = +skill.slice(3); let q = rnd(1, 10); if (q === 1 && Math.random() < .7) q = rnd(2, 10);
    a = t * q; b = t; ans = q;
  }
  const sym = OPS[op];
  return { a, b, ans, op: sym, skill, text: `${a} ${sym} ${b}`, say: `${a} ${WORD[sym]} ${b}` };
}
function distractors(p, n = 3) {
  const A = p.ans, c = new Set();
  const put = v => { if (Number.isInteger(v) && v >= 0 && v !== A) c.add(v); };
  [1, -1, 2, -2].forEach(d => put(A + d));
  if (p.op === '+' || p.op === '−') { put(A + 10); put(A - 10); }
  if (p.op === '×') { put((p.a + 1) * p.b); put((p.a - 1) * p.b); put(p.a * (p.b + 1)); put(p.a * (p.b - 1)); put(p.a + p.b); }
  if (p.op === '÷') { put(A + 3); put(p.a - p.b); }
  if (A >= 12) put(+String(A).split('').reverse().join(''));
  const out = shuffle([...c]).slice(0, n);
  while (out.length < n) { const v = A + rnd(-6, 6); if (v >= 0 && v !== A && !out.includes(v)) out.push(v); }
  return out;
}
function record(skill, ok) {
  const st = P.stats[skill] || (P.stats[skill] = { n: 0, ok: 0, r: [] });
  st.n++; if (ok) st.ok++; st.r.push(ok ? 1 : 0); if (st.r.length > 12) st.r.shift();
  const d = P.days[today()] || (P.days[today()] = { n: 0, ok: 0, ms: 0 });
  d.n++; if (ok) d.ok++;
  save();
}
function dotsHTML(rows, cols) { return `<div><div class="dots" style="grid-template-columns:repeat(${cols},14px)">${'<i></i>'.repeat(rows * cols)}</div></div>`; }
function hintFor(p, hidden) {
  const { a, b, ans, op } = p;
  if (hidden === 'a' || hidden === 'b') {
    const known = hidden === 'a' ? b : a;
    if (op === '+') return `טיפ: <span class="ltr">${ans} − ${known} = ?</span>`;
    if (op === '×') return `טיפ: <span class="ltr">${ans} ÷ ${known} = ?</span>`;
    if (op === '−') return hidden === 'a' ? `טיפ: <span class="ltr">${ans} + ${b} = ?</span>` : `טיפ: <span class="ltr">${a} − ${ans} = ?</span>`;
    if (op === '÷') return hidden === 'a' ? `טיפ: <span class="ltr">${ans} × ${b} = ?</span>` : `טיפ: <span class="ltr">${a} ÷ ${ans} = ?</span>`;
  }
  if (op === '×') return a <= 10 && b <= 10 ? `טיפ: ${a} שורות, בכל שורה ${b}` + dotsHTML(a, b) : '';
  if (op === '÷') return `טיפ: <span class="ltr">${b} × ? = ${a}</span>`;
  const bt = b - b % 10, bo = b % 10;
  if (bt === 0 || bo === 0) return op === '+' ? 'טיפ: קודם העשרות, אחר כך האחדות' : `טיפ: אפשר לבדוק בחיבור: <span class="ltr">? + ${b} = ${a}</span>`;
  if (op === '+') return `טיפ: <span class="ltr">${a} + ${bt} = ${a + bt}</span>, ואז עוד ${bo}`;
  return `טיפ: <span class="ltr">${a} − ${bt} = ${a - bt}</span>, ואז פחות ${bo}`;
}

/* ==================================================

let R = null;
// timeouts that die with the round (going home or starting a new round cancels them)
function later(fn, ms) { const r = R; setTimeout(() => { if (R === r && R) fn(); }, ms); }
function startMode(mode) {
  ac();
  if (R && R.timer) clearInterval(R.timer);
  R = { mode, idx: 0, total: P.settings.perRound, correct: 0, answered: 0, stars: 0, t0: Date.now(), combo: 0, bestCombo: 0,
        seen: new Set(), levelUp: 0, locked: false, timer: null, input: '' };
  const scr = $('#scr-game'), c = MODES[mode].c;
  scr.style.setProperty('--mc', `var(${c[0]})`); scr.style.setProperty('--mcd', `var(${c[1]})`);

}
function newProblem(filter) {
  let p, tries = 0;
  do { p = makeProblem(pickSkill()); tries++; } while ((R.seen.has(p.text) || (filter && !filter(p))) && tries < 40);
  R.seen.add(p.text); return p;
}
function setProg(f) { $('#g-prog').style.width = Math.max(0, Math.min(100, f * 100)) + '%'; }
function setMsg(html, cls) { const m = $('#g-msg'); m.className = 'feedback' + (cls ? ' ' + cls : ''); m.innerHTML = html; }
function setMeta(t) { $('#g-meta').innerHTML = t; }
function nextQ() {
  setMsg('');
  if (R.idx >= R.total) return endRound();
  R.idx++; R.attempts = 0; R.locked = false; R.input = '';
  setProg((R.idx - 1) / R.total);
  setMeta(`${MODES[R.mode].e} ${V(MODES[R.mode].t)} · תרגיל ${R.idx} מתוך ${R.total}`);
  RENDER[R.mode]();
}
const cardTop = () => `<div class="buddy card-buddy" id="card-buddy">${buddySVG()}</div><button class="say" data-act="speak" aria-label="הקראה">🔊</button>`;
const T = v => `<span>${v}</span>`, O = v => `<span class="op">${v}</span>`;
const exprHTML = tokens => `<div class="expr">${tokens.join('')}</div>`;
const SLOT = '<span class="slot" id="slot">?</span>';
function buddyReact(cls) {

}
function celebrate(el) {

  if (R.combo > 0 && R.combo % 5 === 0) { addStars(2); sfx('combo'); toast(`🔥 רצף ${R.combo}! בונוס +2 ⭐`); }

function oops(text, speakText) {

function optionsHTML(opts) { return `<div class="options">${opts.map((o, i) => `<button class="opt o${i}" data-opt="${o}">${o}</button>`).join('')}</div>`; }

const RENDER = {
  quiz() {
    const p = R.p = newProblem(); R.say = p.say;
    $('#g-body').innerHTML = `<div class="prompt-card pop">${cardTop()}${exprHTML([T(p.a), O(p.op), T(p.b), O('='), SLOT])}</div>${optionsHTML(shuffle([p.ans, ...distractors(p)]))}`;
  },
  pad() {
    const p = R.p = newProblem(); R.say = p.say; R.expect = p.ans; R.hidden = null;
    $('#g-body').innerHTML = `<div class="prompt-card pop">${cardTop()}${exprHTML([T(p.a), O(p.op), T(p.b), O('='), SLOT])}</div>${numpadHTML()}`;
  },
  missing() {
    const p = R.p = newProblem(), h = R.hidden = Math.random() < .5 ? 'a' : 'b';
    R.expect = p[h];

    $('#g-body').innerHTML = `<div class="prompt-card pop">${cardTop()}${exprHTML([h === 'a' ? SLOT : T(p.a), O(p.op), h === 'b' ? SLOT : T(p.b), O('='), T(p.ans)])}</div>${numpadHTML()}`;
  },

function numpadHTML() {

}

/* ---- race ---- */

}

/* ---- match ---- */
function initMatch() {

  const ps = []; while (ps.length < pairs) ps.push(newProblem());

  setProg(0);

  $('#g-body').innerHTML = `<div class="legend"><span><i style="background:#d9d2ff"></i>תרגיל</span><span><i style="background:#f3d7b0"></i>תשובה</span></div>
    <div class="match-grid">${cards.map(c => `<button class="mcard ${c.kind}" data-id="${c.id}" data-kind="${c.kind}" data-val="${c.v}">${c.t}</button>`).join('')}</div>`;
}
function tapCard(el) {
  if (R.locked || el.classList.contains('done') || el.classList.contains('sel')) return;

    setMsg(pick(okMsgs()), 'good');

    <div class="row"><button class="btn green" data-again>🔄 עוד סיבוב</button>${heroBtn}</div>

}

    s.className = 'spark'; s.textContent = pick(['⭐', '✨', '💖', '🌟']);

    s.style.setProperty('--dx', rnd(-110, 110) + 'px'); s.style.setProperty('--dy', rnd(-130, -30) + 'px');

}
function confetti() {
  if (reduced) return;

  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.hidden = false; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = ['#ff6fae', '#6c5ce7', '#3fa7ff', '#2ecc71', '#ffc83d', '#ff9f43', '#1dd1a1'];
  const ps = Array.from({ length: 170 }, () => ({ x: W / 2 + rnd(-60, 60), y: H * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
    s: rnd(7, 12), c: pick(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}
function paintBackground() {
  const syms = ['+', '−', '×', '÷', '=', '7', '3', '9', '½', '%'], cols = ['#6c5ce7', '#ff6fae', '#3fa7ff', '#ff9f43', '#1dd1a1'];

    const r = accOf(skillsOf(o)), pct = r.a === null ? 0 : Math.round(r.a * 100);
    return `<div class="oprow"><span>${opName[o]}</span><div class="meter ${cls(r.a)}"><div style="width:${pct}%"></div></div><span class="muted">${r.a === null ? 'אין נתונים' : pct + '% (' + r.n + ')'}</span></div>`;
  }).join('');
  const heatRow = op => `<tr><th>${OPS[op]}</th>${range(2, 10).map(t => {
    const k = op + t, s = P.stats[k], r = s && s.r.length ? s.r.reduce((x, y) => x + y, 0) / s.r.length : null;
    return `<td class="${cls(r)}" title="${skillName(k)}">${r === null ? '–' : Math.round(r * 100) + '%'}</td>`;
  }).join('')}</tr>`;
  const weak = Object.keys(P.stats).filter(k => P.stats[k].r.length >= 3).map(k => ({ k, e: errRate(k) })).filter(x => x.e > .2).sort((a, b) => b.e - a.e).slice(0, 4);
  const week = range(0, 6).reverse().map(i => { const d = new Date(); d.setDate(d.getDate() - i); return { lbl: ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'][d.getDay()], n: (P.days[dstr(d)] || {}).n || 0 }; });
  const maxN = Math.max(1, ...week.map(w => w.n)), s = P.settings;
  $('#parent-body').innerHTML = `
    <div class="panel"><h3>סיכום</h3><div class="stats4">
      <div class="stat"><b>${all.n}</b><span>תרגילים</span></div>
      <div class="stat"><b>${all.a === null ? '–' : Math.round(all.a * 100) + '%'}</b><span>דיוק</span></div>
      <div class="stat"><b>${Math.round(ms / 60000)}</b><span>דקות משחק</span></div>
      <div class="stat"><b>${streakNow()}</b><span>ימים ברצף</span></div>
      <div class="stat"><b>${levelOf(P.xp)}</b><span>רמה</span></div>
    </div></div>
    <div class="panel"><h3>דיוק לפי פעולה</h3>${opRows}</div>
    <div class="panel"><h3>לוח הכפל והחילוק (12 הניסיונות האחרונים בכל לוח)</h3>
      <div class="heat-wrap"><table class="heat"><tr><th style="width:22px"></th>${range(2, 10).map(t => `<th>${t}</th>`).join('')}</tr>${heatRow('mul')}${heatRow('div')}</table></div>
      <div class="muted" style="margin-top:8px;font-size:14px">ירוק: 80% ומעלה · צהוב: 60%-79% · אדום: מתחת ל-60%</div></div>
    <div class="panel"><h3>על מה כדאי לעבוד</h3>${weak.length
      ? `<ul class="focus">${weak.map(w => `<li>${skillName(w.k)}: ${Math.round((1 - w.e) * 100)}% הצלחה לאחרונה</li>`).join('')}</ul><div class="muted" style="font-size:14px">המשחק כבר מציג את הנושאים האלה לעתים קרובות יותר.</div>`
      : '<div class="muted">עדיין אין מספיק נתונים, או שהכול הולך מצוין.</div>'}</div>
    <div class="panel"><h3>שבוע אחרון (תרגילים ביום)</h3><div class="week">${week.map(w => `<div><span>${w.n || ''}</span><i style="height:${Math.round(85 * w.n / maxN)}%"></i>${w.lbl}</div>`).join('')}</div></div>
    <div class="panel"><h3>הגדרות</h3>
      <div class="set-row">שם<input type="text" id="s-name" value="${esc(P.name)}" maxlength="20"></div>
      <div class="set-row">פנייה במשחק<select id="s-gender"><option value="f" ${P.gender !== 'm' ? 'selected' : ''}>בת (לשון נקבה)</option><option value="m" ${P.gender === 'm' ? 'selected' : ''}>בן (לשון זכר)</option></select></div>
      <div class="set-row">פעולות בתרגול<div class="checks">${ops.map(o => `<label><input type="checkbox" data-op="${o}" ${s[o] ? 'checked' : ''}>${opName[o]}</label>`).join('')}</div></div>
      <div class="set-row">טווח חיבור וחיסור<select id="s-range">${[20, 100, 1000].map(v => `<option value="${v}" ${s.range === v ? 'selected' : ''}>עד ${v}</option>`).join('')}</select></div>
      <div class="set-row">תרגילים בסיבוב<select id="s-per">${[5, 8, 10, 15, 20].map(v => `<option value="${v}" ${s.perRound === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="set-row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-voice" ${s.voice ? 'checked' : ''}>הקראה בקול של הודעות</label>
        <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-sound" ${s.sound ? 'checked' : ''}>צלילים</label></div>
      <div class="set-row">קול עברי במכשיר<span class="muted">${heVoice ? 'נמצא, ההקראה תהיה בעברית' : voicesKnown ? 'לא נמצא. המשחק לא יקריא עד שיותקן קול עברי' : 'ייבחר אוטומטית'}</span></div>
      <div class="set-row"><span class="muted" style="font-size:14px">ההתקדמות נשמרת במכשיר הזה בלבד.</span><button class="btn danger small" id="s-reset">איפוס כל ההתקדמות</button></div>
    </div>`;
  $('#parent-body').hidden = false;
}
document.addEventListener('change', e => {
  const t = e.target, s = P.settings;
  if (t.id === 's-name') P.name = t.value.trim() || P.name;
  else if (t.id === 's-gender') { P.gender = t.value; renderParent(); }
  else if (t.dataset.op) {
    s[t.dataset.op] = t.checked;
    if (!['add', 'sub', 'mul', 'div'].some(o => s[o])) { s[t.dataset.op] = true; t.checked = true; toast('צריך לפחות פעולה אחת'); }
  }
  else if (t.id === 's-range') s.range = +t.value;
  else if (t.id === 's-per') s.perRound = +t.value;
  else if (t.id === 's-voice') s.voice = t.checked;
  else if (t.id === 's-sound') s.sound = t.checked;
  else return;
  save();
});

/* ==================================================
   Events
   ================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  if (el.dataset.gender) {
    const nm = $('#setup-name').value.trim();
    if (!nm) { $('#setup-msg').textContent = 'כתבו קודם את השם'; $('#setup-name').focus(); return; }
    P.name = nm; P.gender = el.dataset.gender; giveStarter(); save(); ac(); sfx('win'); confetti();
    return renderHome();
  }
  if (el.dataset.mode) return startMode(el.dataset.mode);
  if (el.dataset.k !== undefined) return typeKey(el.dataset.k);
  if (el.dataset.opt !== undefined) return answerChoice(el, +el.dataset.opt);
  if (el.dataset.tf !== undefined) return answerTF(el, el.dataset.tf === '1');
  if (el.classList.contains('mcard')) return tapCard(el);
  if (el.dataset.act === 'speak') return say(R && R.say, true);
  if (el.dataset.skin) return chooseSkin(el.dataset.skin);
  if (el.dataset.hero) { P.heroes.buddy = el.dataset.hero; save(); sfx('tap'); renderHeroes(); return window.scrollTo({ top: 0, behavior: 'smooth' }); }
  if (el.hasAttribute('data-again')) return startMode(R.mode);
  if (el.hasAttribute('data-heroes')) { R = null; return renderHeroes(); }
  if (el.hasAttribute('data-home')) return goHome();
  switch (el.id) {
    case 'g-back': return goHome();
    case 'go-heroes': return renderHeroes();
    case 'go-parent': return openParent();
    case 'gate-go': return tryGate();
    case 'boxBtn': return openBox();
    case 'revOk': $('#reveal').classList.remove('show'); sfx('tap'); return renderHeroes();
    case 'tog-sound': P.settings.sound = !P.settings.sound; save(); el.textContent = P.settings.sound ? '🔊' : '🔇'; return;
    case 's-reset':
      if (confirm('למחוק את כל הכוכבים, הגיבורים והסטטיסטיקה? אי אפשר לבטל.')) {
        const keep = { name: P.name, gender: P.gender, settings: P.settings };
        P = Object.assign(DEF(), keep); giveStarter(); save(); renderParent(); toast('ההתקדמות אופסה');
      }
  }
});
function goHome() {
  if (R && R.timer) clearInterval(R.timer);
  R = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  renderHome();
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Enter' && e.target.id === 'gate-in') tryGate();
    return;
  }
  if (!R || $('#scr-game').hidden) return;
  if (/^[0-9]$/.test(e.key)) typeKey(e.key);
  else if (e.key === 'Backspace') typeKey('del');
  else if (e.key === 'Enter') typeKey('ok');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) {} } });

/* ==================================================
   Boot + offline install
   ================================================== */
paintBackground();
$('#setup-b1').innerHTML = charSVG(charById('mika'));
$('#setup-b2').innerHTML = charSVG(charById('barki'));
if (P.gender && P.name) renderHome(); else show('scr-setup');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
